# Local dev infra:   pnpm infra:up        (postgres + redis only)
# Full monolith:     pnpm docker:up       (postgres + redis + migrate + app)

x-database-url: &database-url postgresql://agent_chat:agent_chat@postgres:5432/agent_chat?schema=public

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: agent_chat
      POSTGRES_PASSWORD: agent_chat
      POSTGRES_DB: agent_chat
    ports:
      - '${POSTGRES_HOST_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agent_chat -d agent_chat']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.10.2-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_HOST_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  app:
    build:
      context: .
      target: runtime
    image: agent-chat:local
    ports:
      - '${APP_HOST_PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: *database-url
      REDIS_URL: redis://redis:6379
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
  redis-data:
